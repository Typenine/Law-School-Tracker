name: Apply consolidated Notes audit patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'audit/notes-controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/notes-controls
          fetch-depth: 0

      - name: Apply audited Notes changes
        env:
          PATCH_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          data = base64.b64decode(os.environ['PATCH_GZ_B64'])
          open('/tmp/notes-audit.patch', 'wb').write(gzip.decompress(data))
          PY
          printf 'x\n' > .github/workflows/notes-audit-export.yml
          patch -p1 < /tmp/notes-audit.patch
          git diff --check

      - name: Commit consolidated fix
        run: |
          git config user.name 'Type Nine Notes Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Audit and harden Notes interface'
          git push origin HEAD:audit/notes-controls
