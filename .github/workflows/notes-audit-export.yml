name: Apply consolidated Notes audit patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'audit/notes-controls'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: law_school_tracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d law_school_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/law_school_tracker_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/notes-controls
          fetch-depth: 0

      - name: Check whether the patch is already present
        id: gate
        run: |
          if test -f tests/notes-ui.test.py; then
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Reassemble and apply audited Notes changes
        if: steps.gate.outputs.apply == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > /tmp/notes-audit.patch.gz.b64
          for blob in \
            aef0eb792a183a63a3e64a449effc17460468ea8 \
            df8f339097f7b64d9fc7a43f91571f315456e2ad \
            6d6ff0efb4aa28bbaab28f1d9dc3dfc148e0c769 \
            6f2704a011a2e166a083b576512b4a2b95539862 \
            0773e036a5c8fe50126f00b360abca0f41aa654e \
            94ae1548ac8b4729dce4f92aaff46bac545873ae \
            491117f0e520590198747f430c35f0f77cbfddb3 \
            5e00378f92600d0c97b6242e6483799995743ff9 \
            ebc7dbfe37f1fac9e8ebdbe8e787505ec3122d99 \
            a0e632d9d19022f420dd0fce9ce0240d2b795b75 \
            6f18b2c78088308fcccd5b9e59039abb1f3fe9a0 \
            f348dbb7f5684d67cf52c5760923d59cd6e08287 \
            c64967eb0e929cd43323c89c880588c98b1b5887 \
            d9751175c6b7f427923222bbf4fd9efba200df1a \
            165edf937a924ac749a370933a68148693d9f9ef \
            7a177efabac9de9bb1e776216fa92fbc7f3e6bde \
            da5ffe66fe55c0e88b26fe65d4343e5e7d718e6b \
            7ecb2c947b0c469eb70a2ebbea4a08074d7c2348 \
            132ca450f8819f739a04552692157f7f7ff1c824 \
            741c5d6d6973dd376dd7f944d5bca4e6ecd91211 \
            5a4f85d9d9bb6489eedbad461948ff5c80b4589e
          do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" --jq .content \
              | tr -d '\n' | base64 -d >> /tmp/notes-audit.patch.gz.b64
          done
          test "$(wc -c < /tmp/notes-audit.patch.gz.b64)" -eq 19260
          echo 'db3fccc4890bea9ddc169047ec059c3dcfa311ee74fc8b9ef2f78619e5aaa2a0  /tmp/notes-audit.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/notes-audit.patch.gz.b64 | gzip -d > /tmp/notes-audit.patch
          echo '06ca6bccf7468be42bcdb06029b59126d34125b76c230749ab095397fc328a84  /tmp/notes-audit.patch' | sha256sum -c -
          printf 'x' > .github/workflows/notes-audit-export.yml
          patch --batch -p1 < /tmp/notes-audit.patch
          git checkout HEAD -- .github/workflows/notes-audit-export.yml
          git checkout origin/main -- .github/workflows/ci.yml
          git diff --check

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.apply == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.apply == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.gate.outputs.apply == 'true'
        run: npm run typecheck

      - name: Build
        if: steps.gate.outputs.apply == 'true'
        run: npm run build

      - name: API and storage tests
        if: steps.gate.outputs.apply == 'true'
        run: npm test

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.apply == 'true'
        with:
          python-version: '3.12'

      - name: Install Chromium test runner
        if: steps.gate.outputs.apply == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Start production build
        if: steps.gate.outputs.apply == 'true'
        run: |
          npm start > /tmp/law-school-tracker.log 2>&1 &
          echo $! > /tmp/law-school-tracker.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/notes > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/law-school-tracker.log
          exit 1

      - name: Audit Notes interface in Chromium
        if: steps.gate.outputs.apply == 'true'
        env:
          NOTES_E2E_BASE_URL: http://127.0.0.1:3000
        run: python tests/notes-ui.test.py

      - name: Commit consolidated fix
        if: steps.gate.outputs.apply == 'true'
        run: |
          git config user.name 'Type Nine Notes Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Audit and harden Notes interface'
          git push origin HEAD:audit/notes-controls

      - name: Show server log after failure
        if: failure()
        run: cat /tmp/law-school-tracker.log || true
