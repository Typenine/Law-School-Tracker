name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The integration tests drive the real API against a real database, because
    # the bugs worth catching have all been about what Postgres actually does.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: law_school_tracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d law_school_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/law_school_tracker_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Start production build for browser audit
        run: |
          npm start > /tmp/law-school-tracker.log 2>&1 &
          echo $! > /tmp/law-school-tracker.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/notes > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/law-school-tracker.log
          exit 1

      - name: Audit Notes interface in Chromium
        env:
          NOTES_E2E_BASE_URL: http://127.0.0.1:3000
        run: python tests/notes-ui.test.py

      - name: Audit Tasks interface in Chromium
        env:
          TASKS_E2E_BASE_URL: http://127.0.0.1:3000
        run: python tests/tasks-ui.test.py

      - name: Show server log after browser failure
        if: failure()
        run: cat /tmp/law-school-tracker.log || true
