name: Build and type check

on:
  pull_request:
  push:
    branches:
      - redesign/useful-command-center

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        shell: bash
        run: |
          if ! npm run build > build.log 2>&1; then
            tail -n 140 build.log
            exit 1
          fi
          tail -n 50 build.log
